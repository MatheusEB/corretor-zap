<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Corretor Zap: correção ortográfica e pontuação para o WhatsApp com um atalho">
<defs>
  <pattern id="pauta" width="1200" height="30" patternUnits="userSpaceOnUse"><line x1="0" y1="29.5" x2="1200" y2="29.5" stroke="#CFC7B6" stroke-opacity=".45"/></pattern>
  <path id="onda" d="M0 3 Q2 0 4 3 T8 3" fill="none"/>
  <pattern id="ondinha" width="8" height="6" patternUnits="userSpaceOnUse"><path d="M0 3 Q2 0 4 3 T8 3" fill="none" stroke="#C8412B" stroke-width="1.6"/></pattern>
  <filter id="sombra" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1C1A17" flood-opacity=".16"/></filter>
</defs>
<style>
  .serif{font-family:Georgia,'Times New Roman',serif}
  .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  @keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes aparecer{from{opacity:0}to{opacity:1}}
  @keyframes desenhar{to{stroke-dashoffset:0}}
  @keyframes onda{0%,12%{stroke-dashoffset:80}24%,100%{stroke-dashoffset:0}}
  @keyframes erros{0%,52%{opacity:1}58%,96%{opacity:0}100%{opacity:1}}
  @keyframes certo{0%,54%{opacity:0;transform:translateY(6px)}60%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
  @keyframes tecla{0%,36%{transform:none}39%,46%{transform:translateY(4px)}49%,100%{transform:none}}
  @keyframes acesa{0%,36%{fill:#FBFAF6}39%,46%{fill:#DCEBE7}49%,100%{fill:#FBFAF6}}
  @keyframes selo{0%,60%{opacity:0;transform:scale(1.5) rotate(-14deg)}66%,90%{opacity:1;transform:scale(1) rotate(-6deg)}96%,100%{opacity:0;transform:scale(1) rotate(-6deg)}}
  @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
  .a1{animation:subir .9s cubic-bezier(.2,.8,.2,1) .2s both}
  .a2{animation:subir .9s cubic-bezier(.2,.8,.2,1) .4s both}
  .a3{animation:subir .9s cubic-bezier(.2,.8,.2,1) .6s both}
  .a4{animation:aparecer 1s ease .9s both}
  .fio{stroke-dasharray:420;stroke-dashoffset:420;animation:desenhar 1.2s ease-out .7s forwards}
  .balao{animation:subir 1s cubic-bezier(.2,.8,.2,1) .5s both}
  .erros{animation:erros 8s ease 1.4s infinite}
  .certo{animation:certo 8s ease 1.4s infinite;opacity:0}
  .marca{fill:none;stroke:#C8412B;stroke-width:1.8;stroke-linecap:round;stroke-dasharray:80;stroke-dashoffset:80;animation:onda 8s ease 1.4s infinite}
  .t1{transform-box:fill-box;animation:tecla 8s ease 1.4s infinite}
  .t2{transform-box:fill-box;animation:tecla 8s ease 1.47s infinite}
  .t3{transform-box:fill-box;animation:tecla 8s ease 1.54s infinite}
  .t1 rect.capa{animation:acesa 8s ease 1.4s infinite}
  .t2 rect.capa{animation:acesa 8s ease 1.47s infinite}
  .t3 rect.capa{animation:acesa 8s ease 1.54s infinite}
  .selo{transform-origin:1068px 104px;transform-box:view-box;animation:selo 8s cubic-bezier(.2,.8,.2,1) 1.4s infinite;opacity:0}
  .cursor{animation:cursor 1s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.erros{opacity:0}.certo,.selo{opacity:1}.marca{stroke-dashoffset:0}}
</style>

<rect width="1200" height="340" rx="22" fill="#F4F1EA"/>
<rect width="1200" height="340" rx="22" fill="url(#pauta)"/>
<line x1="96" y1="0" x2="96" y2="340" stroke="#C8412B" stroke-opacity=".28"/>

<!-- logo -->
<g transform="translate(128 74)"><g class="a1">
  <rect width="64" height="64" rx="16" fill="#1C1A17"/>
  <path d="M16 19h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H29.6L20 50.4V43h-4a4 4 0 0 1-4-4V23a4 4 0 0 1 4-4Z" fill="#F4F1EA"/>
  <path d="M20 27.2h19" stroke="#1C1A17" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M20 36c1.8-2.4 3.6-2.4 5.4 0s3.6 2.4 5.4 0 3.6-2.4 5.4 0 3.6 2.4 5.4 0" stroke="#C8412B" stroke-width="3.2" fill="none" stroke-linecap="round"/>
</g></g>

<g class="a2"><text class="mono" x="130" y="176" fill="#8A8378" font-size="13" letter-spacing="4">PROJETO DA FACULDADE · JAVA + REACT</text></g>
<g class="a2"><text class="serif" x="126" y="236" fill="#1C1A17" font-size="66">Corretor <tspan fill="#C8412B" font-style="italic">Zap</tspan></text></g>
<line class="fio" x1="130" y1="256" x2="520" y2="256" stroke="#1C1A17" stroke-width="1.5"/>
<g class="a3"><text class="sans" x="130" y="288" fill="#57524A" font-size="18">Ortografia, vírgula e ponto direto no WhatsApp,</text></g>
<g class="a3"><text class="sans" x="130" y="312" fill="#57524A" font-size="18">com um atalho e uma prévia antes de trocar.</text></g>

<!-- balão de mensagem -->
<g class="balao" filter="url(#sombra)">
  <rect x="640" y="56" width="500" height="132" rx="18" fill="#FBFAF6" stroke="#CFC7B6"/>
  <path d="M1120 188 l14 16 l-2 -18 z" fill="#FBFAF6"/>
</g>
<g class="balao">
  <text class="mono" x="664" y="86" fill="#8A8378" font-size="11" letter-spacing="3">MENSAGEM</text>

  <!-- antes: com erros -->
  <g class="erros">
    <text class="mono" font-size="22" fill="#1C1A17">
      <tspan x="664" y="126">voce nao vai acreditar</tspan>
      <tspan x="664" y="160">oque aconteceu</tspan>
    </text>
    <path class="marca" d="M664 134 Q666.0 131 668 134 Q670.0 137 672 134 Q674.0 131 676 134 Q678.0 137 680 134 Q682.0 131 684 134 Q686.0 137 688 134 Q690.0 131 692 134 Q694.0 137 696 134 Q698.0 131 700 134 Q702.0 137 704 134 Q706.0 131 708 134 Q710.0 137 712 134 Q714.0 131 716 134"/>
    <path class="marca" style="animation-delay:1.55s" d="M730 134 Q732.0 131 734 134 Q736.0 137 738 134 Q740.0 131 742 134 Q744.0 137 746 134 Q748.0 131 750 134 Q752.0 137 754 134 Q756.0 131 758 134 Q760.0 137 762 134 Q764.0 131 766 134 Q768.0 137 770 134"/>
    <path class="marca" style="animation-delay:1.7s" d="M664 168 Q666.0 165 668 168 Q670.0 171 672 168 Q674.0 165 676 168 Q678.0 171 680 168 Q682.0 165 684 168 Q686.0 171 688 168 Q690.0 165 692 168 Q694.0 171 696 168 Q698.0 165 700 168 Q702.0 171 704 168 Q706.0 165 708 168 Q710.0 171 712 168 Q714.0 165 716 168"/>
    <rect class="cursor" x="850" y="143" width="2" height="22" fill="#0F6E64"/>
  </g>

  <!-- depois: corrigida -->
  <g class="certo">
    <text class="mono" font-size="22" fill="#1C1A17">
      <tspan x="664" y="126"><tspan fill="#0F6E64" font-weight="700">Você</tspan> <tspan fill="#0F6E64" font-weight="700">não</tspan> vai acreditar</tspan>
      <tspan x="664" y="160"><tspan fill="#0F6E64" font-weight="700">o que</tspan> aconteceu<tspan fill="#0F6E64" font-weight="700">.</tspan></tspan>
    </text>
  </g>
</g>

<!-- teclas -->
<g class="a4">
  <g class="t1"><rect x="700" y="238" width="86" height="46" rx="9" fill="#CFC7B6"/><rect class="capa" x="700" y="232" width="86" height="46" rx="9" fill="#FBFAF6" stroke="#CFC7B6"/><text class="mono" x="743" y="262" text-anchor="middle" font-size="17" fill="#1C1A17">Ctrl</text></g>
  <text class="serif" x="806" y="264" font-size="22" fill="#8A8378">+</text>
  <g class="t2"><rect x="828" y="238" width="96" height="46" rx="9" fill="#CFC7B6"/><rect class="capa" x="828" y="232" width="96" height="46" rx="9" fill="#FBFAF6" stroke="#CFC7B6"/><text class="mono" x="876" y="262" text-anchor="middle" font-size="17" fill="#1C1A17">Shift</text></g>
  <text class="serif" x="944" y="264" font-size="22" fill="#8A8378">+</text>
  <g class="t3"><rect x="966" y="238" width="112" height="46" rx="9" fill="#CFC7B6"/><rect class="capa" x="966" y="232" width="112" height="46" rx="9" fill="#FBFAF6" stroke="#CFC7B6"/><text class="mono" x="1022" y="262" text-anchor="middle" font-size="17" fill="#1C1A17">Espaço</text></g>
</g>

<!-- carimbo -->
<g class="selo">
  <rect x="1016" y="88" width="104" height="32" rx="6" fill="#FBFAF6" stroke="#0F6E64" stroke-width="2.5"/>
  <text class="mono" x="1068" y="109" text-anchor="middle" font-size="13" font-weight="700" fill="#0F6E64" letter-spacing="3">REVISADO</text>
</g>
</svg>
