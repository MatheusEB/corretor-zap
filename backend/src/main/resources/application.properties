spring.application.name=corretor-zap

# Só esta máquina acessa o painel e a API (o histórico guarda mensagens pessoais)
server.address=127.0.0.1
server.port=8765
corretor.origens-permitidas=http://localhost:8765,http://127.0.0.1:8765,http://localhost:5173

# Arquivo onde ficam atalho, dicionário pessoal e regras desativadas
corretor.config-dir=${user.home}/.corretor-zap

# Liga o atalho global do teclado e a janela/bandeja do app (desligados nos testes)
corretor.atalho.habilitado=true
corretor.janela.habilitada=true

# Respostas comprimidas (o cache dos arquivos do painel fica em ConfiguracaoWeb)
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
